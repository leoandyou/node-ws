<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日农历 - 在线日历</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        :root {
            --primary-color: #c0392b; /* 中国红 */
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calendar-card {
            background: var(--card-bg);
            width: 380px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .calendar-card:hover {
            transform: translateY(-5px);
        }

        /* 顶部红色区域：公历 */
        .card-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
        }

        .solar-year {
            font-size: 1.2rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .solar-date {
            font-size: 4rem;
            font-weight: bold;
            margin: 5px 0;
            line-height: 1;
        }

        .week-day {
            font-size: 1.5rem;
            font-weight: 300;
        }

        /* 下部区域：农历 */
        .card-body {
            padding: 25px;
            color: var(--text-main);
        }

        .lunar-main {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-family: "KaiTi", "楷体", serif; /* 传统韵味字体 */
        }

        .lunar-ganzhi {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .solar-term {
            display: inline-block;
            background-color: #fce4ec;
            color: #c2185b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .time-display {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: var(--text-sub);
            font-family: monospace;
            font-size: 1.1rem;
        }

        /* 宜忌部分 */
        .yi-ji-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: left;
        }
        
        .yi-ji-item {
            width: 48%;
        }

        .label-circle {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 50%;
            color: white;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .label-yi { background-color: #27ae60; }
        .label-ji { background-color: #c0392b; }

        .content-text {
            display: block;
            margin-top: 5px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

    </style>
</head>
<body>

<div class="calendar-card">
    <div class="card-header">
        <div class="solar-year" id="solarYearMonth">Loading...</div>
        <div class="solar-date" id="solarDay">--</div>
        <div class="week-day" id="weekDay">Wait</div>
    </div>

    <div class="card-body">
        <div class="lunar-main" id="lunarDate">正在计算...</div>
        <div class="lunar-ganzhi" id="ganZhi"></div>
        <div id="termBox" style="display:none;"><span class="solar-term" id="solarTerm"></span></div>

        <div class="yi-ji-box">
            <div class="yi-ji-item">
                <div><span class="label-circle label-yi">宜</span></div>
                <span class="content-text" id="yiText">--</span>
            </div>
            <div class="yi-ji-item">
                <div><span class="label-circle label-ji">忌</span></div>
                <span class="content-text" id="jiText">--</span>
            </div>
        </div>

        <div class="time-display" id="clock">00:00:00</div>
    </div>
</div>

<script>
    function updateCalendar() {
        const now = new Date();

        // 1. 更新公历显示
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        document.getElementById('solarYearMonth').innerText = `${year}年 ${month}月`;
        document.getElementById('solarDay').innerText = day;
        document.getElementById('weekDay').innerText = weekDays[now.getDay()];

        // 2. 更新时间显示
        const timeString = now.toLocaleTimeString('en-GB', { hour12: false }); // 24小时制
        document.getElementById('clock').innerText = timeString;

        // 3. 更新农历 (使用 Lunar 库)
        // Solar.fromDate 是库中的方法，将 JS Date 对象转换为库的 Solar 对象
        const solar = Solar.fromDate(now);
        const lunar = solar.getLunar();

        // 农历日期 (例: 正月十五)
        document.getElementById('lunarDate').innerText = "农历" + lunar.getMonthInChinese() + "月" + lunar.getDayInChinese();

        // 干支纪年 + 生肖 (例: 甲辰年 [龙])
        const ganZhiStr = `${lunar.getYearInGanZhi()}年 [${lunar.getYearShengXiao()}]`;
        document.getElementById('ganZhi').innerText = ganZhiStr;

        // 节气 (如果有)
        const jieQi = lunar.getJieQi();
        const termBox = document.getElementById('termBox');
        if (jieQi) {
            document.getElementById('solarTerm').innerText = jieQi;
            termBox.style.display = 'block';
        } else {
            termBox.style.display = 'none';
        }

        // 宜忌 (取前4个，防止文字过长)
        const yiList = lunar.getDayYi();
        const jiList = lunar.getDayJi();
        
        document.getElementById('yiText').innerText = yiList.slice(0, 4).join(' ') || "诸事不宜";
        document.getElementById('jiText').innerText = jiList.slice(0, 4).join(' ') || "诸事不忌";
    }

    // 初始化并每秒更新
    updateCalendar();
    setInterval(updateCalendar, 1000);
</script>

</body>
</html>
